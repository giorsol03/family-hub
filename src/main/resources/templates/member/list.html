<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Members · Family Hub</title></head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 m-0">Members</h1>
        <a th:href="@{/members/new}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Add</a>
    </div>

    <ul class="list-group">
        <li class="list-group-item d-flex align-items-center gap-3" th:each="m : ${members}"
            th:classappend="${!m.active} ? 'text-body-secondary'">
            <span class="member-avatar" th:style="|background-color: ${m.color}|"
                  th:text="${#strings.substring(m.name, 0, 1).toUpperCase()}">A</span>
            <div class="flex-grow-1 min-w-0">
                <div class="fw-semibold text-truncate">
                    <span th:text="${m.name}">Name</span>
                    <span th:if="${!m.active}" class="badge text-bg-secondary ms-1">Inactive</span>
                    <span th:if="${currentMember.id == m.id}" class="badge text-bg-light border ms-1">You</span>
                </div>
                <div class="small text-body-secondary" th:text="'@' + ${m.username}">@user</div>
            </div>
            <div class="d-flex gap-1">
                <a th:href="@{/members/{id}/edit(id=${m.id})}" class="btn btn-sm btn-outline-secondary"
                   aria-label="Edit"><i class="bi bi-pencil"></i></a>
                <form th:if="${m.active and currentMember.id != m.id}"
                      th:action="@{/members/{id}/deactivate(id=${m.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Deactivate"
                            aria-label="Deactivate"><i class="bi bi-person-dash"></i></button>
                </form>
                <form th:if="${!m.active}" th:action="@{/members/{id}/activate(id=${m.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-success" title="Re-activate"
                            aria-label="Re-activate"><i class="bi bi-person-check"></i></button>
                </form>
            </div>
        </li>
    </ul>
</main>
</body>
</html>
