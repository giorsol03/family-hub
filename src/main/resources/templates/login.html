<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#212529">
    <title>Log in · Family Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-body-tertiary">
<main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="card shadow-sm login-card w-100">
        <div class="card-body p-4">
            <h1 class="h4 text-center mb-4"><i class="bi bi-house-heart"></i> Family Hub</h1>

            <div th:if="${param.error}" class="alert alert-danger py-2">Wrong username or password.</div>
            <div th:if="${param.logout}" class="alert alert-success py-2">You've been logged out.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control"
                           autocomplete="username" autocapitalize="none" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" id="remember-me" name="remember-me" class="form-check-input" checked>
                    <label for="remember-me" class="form-check-label">Keep me logged in</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
