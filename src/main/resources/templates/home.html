<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Family Hub</title></head>
<body>
<main>
    <h1 class="h4 mb-3">Hi <span th:text="${currentMember.name}">there</span> 👋</h1>
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
        <div class="col" th:each="item : ${navItems}" th:unless="${item.key == 'home'}">
            <a th:if="${item.enabled}" th:href="@{${item.path}}" class="card h-100 text-decoration-none section-card">
                <div class="card-body text-center">
                    <i th:class="|bi bi-${item.icon} fs-1|"></i>
                    <div class="mt-2 fw-semibold" th:text="${item.label}">Section</div>
                </div>
            </a>
            <div th:unless="${item.enabled}" class="card h-100 section-card text-body-secondary opacity-50">
                <div class="card-body text-center">
                    <i th:class="|bi bi-${item.icon} fs-1|"></i>
                    <div class="mt-2 fw-semibold" th:text="${item.label}">Section</div>
                    <div class="small">Coming soon</div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
