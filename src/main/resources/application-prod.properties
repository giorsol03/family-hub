# Production (Render + Neon). Activate with SPRING_PROFILES_ACTIVE=prod.
# Env vars have NO defaults on purpose: ProductionEnvironmentCheck stops the app at startup with a clear
# list of what is missing, instead of silently running with a dev value.

# --- Database (Neon PostgreSQL) ---
# DATABASE_URL can be pasted exactly as Neon shows it:
#   postgresql://user:password@ep-xxx-123456.eu-central-1.aws.neon.tech/familyhub?sslmode=require
# or in JDBC form with DATABASE_USERNAME / DATABASE_PASSWORD set separately. ProductionEnvironmentCheck
# converts the first form into the properties below.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
# Small household app on Neon's free tier: few connections, and let idle ones close
# so Neon can suspend the database when nobody is using it.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
# Neon may take a few seconds to wake up from suspend.
spring.datasource.hikari.connection-timeout=30000

spring.h2.console.enabled=false

# --- Security ---
app.remember-me-key=${REMEMBER_ME_KEY}
# Render terminates HTTPS and forwards X-Forwarded-* headers: trust them so Spring knows the
# request was HTTPS (secure cookies, correct redirects).
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
server.error.include-stacktrace=never

# --- Static SPA ---
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
