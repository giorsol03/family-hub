spring.application.name=family-hub
# Local runs use the H2 "dev" profile unless another profile is activated (e.g. prod later).
spring.profiles.default=dev

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Load lazy collections/associations in batches (avoids N+1 queries on list pages)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# Household timezone used for "today", week boundaries, etc.
app.timezone=Europe/Nicosia

# First member, created on startup only when the member table is empty.
app.bootstrap.username=${APP_ADMIN_USERNAME:}
app.bootstrap.password=${APP_ADMIN_PASSWORD:}
app.bootstrap.name=${APP_ADMIN_NAME:Admin}

# Signing key for remember-me cookies. Override in every real deployment.
app.remember-me-key=${REMEMBER_ME_KEY:dev-only-remember-me-key}
